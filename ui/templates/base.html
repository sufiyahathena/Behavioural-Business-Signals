<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BrandSignals{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/home" class="nav-brand">BrandSignals</a>
            <div class="nav-links">
                <a href="/companies" class="{{ 'nav-active' if active_page == 'companies' }}">Companies</a>
                <a href="/financial-breakdown" class="{{ 'nav-active' if active_page == 'financial' }}">Financial Breakdown</a>
                <a href="/behavioural-breakdown" class="{{ 'nav-active' if active_page == 'behavioural' }}">Behavioural Breakdown</a>
                <a href="/about" class="{{ 'nav-active' if active_page == 'about' }}">About</a>
                <a href="/purpose" class="{{ 'nav-active' if active_page == 'purpose' }}">Purpose</a>
            </div>
        </div>
    </nav>
    <main style="margin:0;padding:0;">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>BrandSignals — Data for internal research use only</p>
    </footer>
</body>
</html>
